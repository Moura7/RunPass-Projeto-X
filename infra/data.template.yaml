AWSTemplateFormatVersion: '2010-09-09'
Description: RunPass S09 data, object, queue and alarm candidate; NOT deployed. Apply before app.template.yaml.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  IdentityTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - {Key: Project, Value: RunPass}
        - {Key: Environment, Value: !Ref Environment}

  CatalogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - {Key: Project, Value: RunPass}
        - {Key: Environment, Value: !Ref Environment}

  HistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - {Key: Project, Value: RunPass}
        - {Key: Environment, Value: !Ref Environment}

  OperationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      DeletionProtectionEnabled: !If [IsProd, true, false]
      StreamSpecification: {StreamViewType: NEW_IMAGE}
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - {Key: Project, Value: RunPass}
        - {Key: Environment, Value: !Ref Environment}

  ProjectionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - {Key: Project, Value: RunPass}
        - {Key: Environment, Value: !Ref Environment}

  ErasureControlTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: false}
      DeletionProtectionEnabled: !If [IsProd, true, false]
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - {Key: Project, Value: RunPass}
        - {Key: Environment, Value: !Ref Environment}

  MedalBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: RemoveTemporaryUploads
            Prefix: temporary/
            Status: Enabled
            ExpirationInDays: 2
            NoncurrentVersionExpiration: {NoncurrentDays: 1}
          - Id: AbortIncompleteMultipart
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
      Tags:
        - {Key: Project, Value: RunPass}
        - {Key: Environment, Value: !Ref Environment}

  AuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireEvaluationAudit
            Status: Enabled
            ExpirationInDays: 60
            NoncurrentVersionExpiration: {NoncurrentDays: 1}
          - Id: AbortIncompleteMultipart
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
      Tags:
        - {Key: Project, Value: RunPass}
        - {Key: Environment, Value: !Ref Environment}

  MedalBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MedalBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt MedalBucket.Arn
              - !Sub '${MedalBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AuditBucket.Arn
              - !Sub '${AuditBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  EventDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true

  EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventDeadLetterQueue.Arn
        maxReceiveCount: 5

  AuditDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true

  AuditQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AuditDeadLetterQueue.Arn
        maxReceiveCount: 5

  CriticalAlerts:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - {Key: Project, Value: RunPass}
        - {Key: Environment, Value: !Ref Environment}

  EventDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RunPass event DLQ has visible messages
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CriticalAlerts]

  AuditDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RunPass audit DLQ has visible messages
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AuditDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CriticalAlerts]

Outputs:
  IdentityTable:
    Value: !Ref IdentityTable
    Export:
      Name: !Sub '${AWS::StackName}-IdentityTable'
  CatalogTable:
    Value: !Ref CatalogTable
    Export:
      Name: !Sub '${AWS::StackName}-CatalogTable'
  HistoryTable:
    Value: !Ref HistoryTable
    Export:
      Name: !Sub '${AWS::StackName}-HistoryTable'
  OperationsTable:
    Value: !Ref OperationsTable
    Export:
      Name: !Sub '${AWS::StackName}-OperationsTable'
  OperationsStreamArn:
    Value: !GetAtt OperationsTable.StreamArn
    Export:
      Name: !Sub '${AWS::StackName}-OperationsStreamArn'
  ProjectionsTable:
    Value: !Ref ProjectionsTable
    Export:
      Name: !Sub '${AWS::StackName}-ProjectionsTable'
  ErasureControlTable:
    Value: !Ref ErasureControlTable
    Export:
      Name: !Sub '${AWS::StackName}-ErasureControlTable'
  MedalBucket:
    Value: !Ref MedalBucket
    Export:
      Name: !Sub '${AWS::StackName}-MedalBucket'
  AuditBucket:
    Value: !Ref AuditBucket
    Export:
      Name: !Sub '${AWS::StackName}-AuditBucket'
  EventQueueUrl:
    Value: !Ref EventQueue
    Export:
      Name: !Sub '${AWS::StackName}-EventQueueUrl'
  EventQueueArn:
    Value: !GetAtt EventQueue.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EventQueueArn'
  AuditQueueUrl:
    Value: !Ref AuditQueue
    Export:
      Name: !Sub '${AWS::StackName}-AuditQueueUrl'
  AuditQueueArn:
    Value: !GetAtt AuditQueue.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AuditQueueArn'
  CriticalAlertsTopic:
    Value: !Ref CriticalAlerts
    Export:
      Name: !Sub '${AWS::StackName}-CriticalAlertsTopic'
